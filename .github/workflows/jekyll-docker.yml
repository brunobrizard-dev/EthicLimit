name: Deploy Pages          # ← Nom du workflow (affiché dans Actions)

on:                         # ← Déclencheur
  push:                     
    branches: ["main"]      # ← Se lance à chaque push sur main

permissions:                # ← Droits nécessaires pour écrire sur Pages
  contents: read
  pages: write
  id-token: write

jobs:                       # ← Les tâches à exécuter
  deploy:                   # ← Nom de la tâche
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest  # ← Machine virtuelle utilisée

    steps:                  # ← Les étapes dans l'ordre
      - uses: actions/checkout@v4         # 1. Télécharge le code du repo
      - uses: actions/configure-pages@v5  # 2. Configure GitHub Pages
      - uses: actions/upload-pages-artifact@v4  # 3. Prépare les fichiers
          with:
            path: '.'                     #    Prend tout le dossier racine
      - uses: actions/deploy-pages@v5     # 4. Met en ligne
          id: deployment
